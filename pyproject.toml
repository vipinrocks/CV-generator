[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cvforge"
version = "0.1.0"
description = "A professional, ATS-friendly CV/resume generator: YAML or web form in, PDF/DOCX/HTML out."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CVForge Contributors" }]
keywords = ["cv", "resume", "pdf", "docx", "ats", "generator", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.0",
    "python-docx>=1.1",
    "Pillow>=10.0",
    "weasyprint>=61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pypdf>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.6",
    "streamlit>=1.36",
]

[project.scripts]
cvforge = "cvforge.cli:main"

[project.urls]
Homepage = "https://github.com/cvforge/cvforge"
Documentation = "https://github.com/cvforge/cvforge#readme"
Issues = "https://github.com/cvforge/cvforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cvforge"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "N818",   # allow non Error-suffixed exception names
    "RUF001", # project is intentionally Unicode-heavy (en dashes, icons)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]
"src/cvforge/cli.py" = ["B008"]   # typer.Option in defaults is the Typer idiom
"src/cvforge/sample.py" = ["E501"] # embedded sample data lines
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "yaml.*",
    "jinja2.*",
    "weasyprint.*",
    "docx.*",
    "PIL.*",
    "typer.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/cvforge"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
